storage:
  dbPath: /data/mongo/rs0_27019
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
systemLog:
  destination: file
  path: /data/mongo/rs0_27019/mongod.log
  logAppend: true
net:
  port: 27019
  bindIp: 127.0.0.1
replication:
  replSetName: rs0
security:
  authorization: enabled
  keyFile: /data/mongo/keyfile
