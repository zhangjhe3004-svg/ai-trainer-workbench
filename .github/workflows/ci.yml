name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          cd skill-graph-learning
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 语法检查（编译所有 .py）
        run: |
          cd skill-graph-learning
          python -m compileall -q app data scripts

      - name: 运行离线单元测试（NLP + 工程能力）
        run: |
          cd skill-graph-learning
          pytest -v
